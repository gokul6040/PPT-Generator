name: Bug report
description: Report a reproducible defect in the application.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include credentials, customer documents, or other sensitive data.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the application with ...
        2. Upload ...
        3. Send ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Frontend
        - API
        - Content generation
        - PowerPoint rendering
        - Storage
        - Deployment
        - Other
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Version or commit
      description: Provide a release, branch, or commit SHA when known.
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Remove credentials, connection strings, document content, and personal data.
      render: shell
